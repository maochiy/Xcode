# electron-builder 配置
# 文档: https://www.electron.build/configuration/configuration

appId: com.proma.app
productName: Xcode
copyright: Copyright © 2024-2026 Erlich Liu

# Electron 版本（CI 环境 bun workspace 下无法自动检测，需显式指定）
electronVersion: 39.5.1

# 目录配置
directories:
  output: out
  buildResources: resources

# 压缩配置
compression: normal

# afterPack Hook：修复 macOS extraResources 中 proma CLI 被复制后损坏的代码签名，
# 校验 proma CLI 与 Pi Runtime 均可随安装包使用。
# （无效签名在 arm64 上会 SIGKILL / exit 137，导致 Agent 内 proma session 全挂）
afterPack: dist/electron-builder-after-pack.cjs
afterSign: dist/electron-builder-after-sign.cjs

# ASAR 打包配置
asar: true
asarUnpack:
  - "node_modules/@silvia-odwyer/**"
  - "node_modules/@mariozechner/**"
  - "node_modules/@napi-rs/**"
  - "node_modules/node-pty/**"
  # Proma Pi 基础内核：pi-worker 以独立 fork 进程运行，运行时动态 import
  # @earendil-works/*（pi-tui 含 native .node），必须在 ASAR 外才能被解析；
  # proper-lockfile / signal-exit 由 pi-worker-compat.cjs 在子进程中 patch。
  - "node_modules/@earendil-works/**"
  - "node_modules/proper-lockfile/**"
  - "node_modules/signal-exit/**"
  # typebox 由 pi-worker 顶层 runtimeImport('typebox') 解析，需在 ASAR 外。
  - "node_modules/typebox/**"
  # Pi Worker 的 ESM 依赖必须与 Worker 一起位于 ASAR 外。
  # partial-json 是 pi-ai 的传递依赖，但 Bun 可能将其提升到仓库根目录；
  # 显式声明为 Electron 依赖并单独解包，避免生产包中出现模块解析失败。
  - "node_modules/partial-json/**/*"
  # 统一兜底：Pi Worker 是独立子进程，读不到 ASAR 内的文件。只要 ASAR 外的
  # ESM/CJS 文件 import 了仍打包在 app.asar 里的依赖，Node 就会沿
  # app.asar.unpacked/node_modules 物理路径解析失败。
  - "node_modules/**/*"

# 跳过 npm install（代码已被 esbuild/Vite 打包，npm 不识别 workspace:* 协议）
npmRebuild: false

# 通用文件配置
files:
  - dist/**/*
  - "!dist/electron-builder-after-pack.cjs"
  - "!dist/electron-builder-after-sign.cjs"
  # 排除 build:resources 脚本拷到 dist/resources 的副本（electron-builder 已通过
  # buildResources 从 resources/ 直接使用 icon/plist，避免产物里重复打包一份）
  - "!dist/resources/**"
  - package.json
  # 主进程依赖默认由 esbuild 打包；保留 node_modules 仅承载 native addon 等资源。
  - node_modules/**/*
  # 排除 workspace 包的 symlink（代码已被 esbuild/Vite 打包到 dist/ 中）
  - "!node_modules/@proma/**"
  # 排除明确只在开发/构建期使用的大体积包。
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/electronmon/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@electron/**"
  - "!node_modules/@electron-builder/**"
  - "!node_modules/@esbuild/**"

# 通用额外资源
extraResources:
  - from: resources/browser
    to: browser
    filter:
      - "browser-preload.cjs"
  # Pi Worker 启动兼容补丁：只修复 proper-lockfile 与 signal-exit 的旧版导出冲突。
  - from: resources/pi-worker-compat.cjs
    to: pi-worker-compat.cjs
  # Proma Pi 基础内核 Runtime（pi-bridge + pi-worker + thread-context-v2），
  # 保持在 ASAR 外由主进程 fork 运行；依赖的 @earendil-works/* / typebox
  # 通过应用 node_modules 解析（见 runtimeRoot 解析逻辑）。
  - from: resources/pi-runtime
    to: pi-runtime
    filter:
      - "**/*"
      - "!**/*.test.ts"
  # proma CLI 自包含二进制（build:cli 用 bun build --compile 产出到 resources/bin/）。
  # 运行时由主进程注入 PROMA_CLI 环境变量，暴露给 skill / Agent 调用。
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  # 默认 Skills 模板（首次启动时同步到 ~/.proma/default-skills/）
  - from: default-skills
    to: default-skills
    filter:
      - "**/*"
  # 教程文件（教程查看器 + 欢迎对话使用）
  - from: ../../tutorial/tutorial-v2.md
    to: tutorial.md
  # Proma 品牌 Logo 素材（品牌素材下载功能使用）
  - from: resources/proma-logos
    to: proma-logos
    filter:
      - "**/*"
  # 默认窗口图标资源；macOS Dock 直接使用 Bundle 图标，不再支持配色覆盖。
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.icns
    to: icon.icns
  - from: resources/icon.ico
    to: icon.ico

# ============================================
# macOS 配置
# ============================================
mac:
  # 安装后的 Bundle 文件名固定为小写 xcodes.app；显示名称仍为 Xcode。
  executableName: xcodes
  artifactName: xcodes-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Xcode 需要访问麦克风，用于将你的语音实时转写为文本。"
  fileAssociations:
    - ext: proma-backup
      name: Xcode Personal Backup
      role: Editor
    - ext: proma-share
      name: Xcode Share Package
      role: Editor
  # 架构由 CLI 参数控制（CI 矩阵分别传 --arm64 / --x64）。
  target:
    - dmg
    - zip

# DMG 配置
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# ============================================
# Windows 配置
# ============================================
win:
  artifactName: xcodes-${version}-windows-${arch}.${ext}
  icon: resources/icon.ico
  fileAssociations:
    - ext: proma-backup
      name: Xcode Personal Backup
      icon: resources/icon.ico
    - ext: proma-share
      name: Xcode Share Package
      icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

# NSIS 安装程序配置
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# ============================================
# 发布配置
# 每个平台的 build job 通过 --publish always 直接上传到 GitHub Release。
# electron-builder 会自动创建/复用 Release，并在多架构并行上传时合并 latest-mac.yml。
# ============================================
publish:
  provider: github
  owner: maochiy
  repo: Xcode
